<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phở Rush — Quán phở đường phố</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1608; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; image-rendering: auto; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Phở Rush: nấu phở và phục vụ khách trong quán ăn đường phố Việt Nam"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
